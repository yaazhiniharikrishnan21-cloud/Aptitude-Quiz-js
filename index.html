<!DOCTYPE html>
<html>
<head>
    <title>Yaazhini's Aptitude Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-box">
        <h1>Aptitude Challenge 🚀</h1>
        <p>By Yaazhini Harikrishnan | 2026 Grad</p>
        
        <div id="question-box">
            <h2 id="question">Question loading...</h2>
            <div id="options"></div>
            <button id="next-btn">Next Question</button>
        </div>
        
        <div id="result-box" style="display:none;">
            <h2>Your Score: <span id="score">0</span>/5</h2>
            <p id="message"></p>
            <button onclick="location.reload()">Try Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
